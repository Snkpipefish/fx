name: Oppdater data og publiser

on:
  schedule:
    # Hverdager kl. 06:45 UTC – etter ECBs referansekurser (ca. 16:00 CET dagen før
    # er allerede inne; 06:45 fanger også BIS/OECD-oppdateringer fra natten)
    - cron: "45 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Kjør tester
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs

      # RBNZ ligger bak Cloudflare og avviser vanlige HTTP-klienter; B2-tabellen hentes
      # med headless Chromium (scripts/fetch_rbnz.py). Feiler dette, beholdes forrige NZD-kurve.
      - name: Hent RBNZ B2 med Playwright
        env:
          RBNZ_B2_FILE: ${{ runner.temp }}/rbnz-b2.xlsx
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/fetch_rbnz.py

      - name: Hent ferske markedsdata
        env:
          RBNZ_B2_FILE: ${{ runner.temp }}/rbnz-b2.xlsx
        run: python3 scripts/fetch_data.py

      - name: Commit oppdaterte data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater markedsdata [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Kjøres etter publisering, så en gammel kilde gir rød kjøring (varsel) uten å stoppe siden.
      - name: Sjekk at kildene er ferske
        run: python3 scripts/check_sources.py
